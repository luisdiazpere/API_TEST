<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account — IP Lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-bar">
    <a class="brand" href="/login.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span class="brand-title">IP Lookup</span>
    </a>
  </header>

  <main class="auth-content">
    <form id="signup-form" class="auth-card">
      <div class="auth-header">
        <div class="auth-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        </div>
        <h1>Create account</h1>
        <p>Start tracking your batch lookup history</p>
      </div>

      <div id="form-error" class="form-error" hidden></div>

      <div class="auth-fields">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirmPassword" autocomplete="new-password" minlength="8" required />
        </div>
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">Create Account</button>
      <button type="button" class="btn-secondary" id="clerk-btn" disabled>Continue with Clerk</button>

      <div class="auth-secondary">
        <span>Already have an account?</span>
        <a href="/login.html">Sign in</a>
      </div>
    </form>
  </main>

  <script src="auth-pages.js"></script>
  <script src="/clerk-key.js"></script>
  <script defer crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@clerk/ui@1.32.0/dist/ui.browser.js"></script>
  <script defer crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@6.31.0/dist/clerk.browser.js"></script>
  <script src="clerk-auth.js"></script>
</body>
</html>
