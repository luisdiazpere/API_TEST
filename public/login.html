<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — IP Lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-bar">
    <a class="brand" href="/login.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span class="brand-title">IP Lookup</span>
    </a>
  </header>

  <main class="auth-content">
    <form id="login-form" class="auth-card">
      <div class="auth-header">
        <div class="auth-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1>Sign in</h1>
        <p>Access your saved lookup history</p>
      </div>

      <div id="form-error" class="form-error" hidden></div>

      <div class="auth-fields">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
          <div class="forgot-row">
            <a href="#" id="forgot-link">Forgot password?</a>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">Sign In</button>

      <div class="auth-secondary">
        <span>Don't have an account?</span>
        <a href="/signup.html">Create one</a>
      </div>
    </form>
  </main>

  <script src="auth-pages.js"></script>
</body>
</html>
